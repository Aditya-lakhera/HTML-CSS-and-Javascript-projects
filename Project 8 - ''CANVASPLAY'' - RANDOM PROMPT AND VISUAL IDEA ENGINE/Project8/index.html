<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Writing Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="heading">Writing Board</h1>
    <div id="tools">
        <p id="drawing">Drawing Tools &#10145;</p>
        <div class="colorInput">
            <label for="strokeColor">Color</label>
            <input id="strokeColor" type="color" value="#000000" />
      </div>
      <div class="brushSizeInput">
            <label for="brushSize">Brush</label>
            <input id="brushSize" type="range" value="5" 
            min="1" max="50" />
      </div>
        <button class="button" id="pen">&#128396; Pen</button>
        <button class="button" id="eraser">&#129676; Eraser</button>
        <button class="button" id="square">&#11035; Draw Square</button>
        <button class="button" id="cleanup">&#129529; Full Screen Cleanup</button>
        <button class="button" id="downloadImage">&#128229; Download Image</button>

    </div>
    <canvas id="canvas"></canvas>
    <script src="./script.js"></script>
</body>
</html>
